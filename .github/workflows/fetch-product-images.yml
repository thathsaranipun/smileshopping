name: Fetch product photos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/product-images.json', 'scripts/fetch-images.mjs']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-images.mjs
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/products
          git diff --cached --quiet && echo "No new photos" || git commit -m "Add product photos" && git push
